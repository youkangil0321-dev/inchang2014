<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매입매출 관리 — 인창</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f0f2f7; --sur:#ffffff; --sur2:#e8eaf2; --bdr:#d0d4e4;
  --blue:#2563eb; --green:#059669; --yellow:#d97706; --red:#dc2626;
  --bdim:rgba(37,99,235,.10); --gdim:rgba(5,150,105,.10);
  --txt:#1e2235; --dim:#6b7280; --muted:#9ca3af;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--txt); font-family:'Noto Sans KR',sans-serif; font-size:14px; min-height:100vh; }

header { background:var(--sur); border-bottom:1px solid var(--bdr); padding:0 24px; display:flex; align-items:center; justify-content:space-between; height:54px; position:sticky; top:0; z-index:200; }
.logo { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; letter-spacing:.06em; }
.logo em { color:var(--blue); font-style:normal; }
.badge { background:var(--sur2); border:1px solid var(--bdr); border-radius:4px; padding:4px 10px; font-size:11px; font-family:'IBM Plex Mono',monospace; }
.badge.on { border-color:var(--green); color:var(--green); }

.tabs { display:flex; background:var(--sur); border-bottom:1px solid var(--bdr); padding:0 24px; }
.tab { padding:11px 20px; cursor:pointer; color:var(--dim); font-size:13px; font-weight:500; border-bottom:2px solid transparent; transition:all .18s; white-space:nowrap; }
.tab:hover { color:var(--txt); }
.tab.active { color:var(--txt); border-bottom-color:var(--blue); }

.wrap { padding:20px 24px; max-width:1460px; margin:0 auto; }
.panel { display:none; }
.panel.active { display:block; }

/* DROP */
.drop { border:2px dashed var(--bdr); border-radius:10px; padding:52px 32px; text-align:center; cursor:pointer; transition:all .22s; background:var(--sur); position:relative; margin-bottom:18px; }
.drop:hover, .drop.over { border-color:var(--blue); background:var(--bdim); }
.drop input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.drop-icon { font-size:40px; margin-bottom:12px; }
.drop-title { font-size:16px; font-weight:600; margin-bottom:6px; }
.drop-sub { font-size:12px; color:var(--dim); line-height:1.8; }

/* CARDS */
.cards { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
.card { background:var(--sur); border:1px solid var(--bdr); border-radius:8px; padding:22px; }
.card-lbl { font-size:13px; color:var(--dim); margin-bottom:10px; font-weight:500; }
.card-val { font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; line-height:1; }
.card-sub { font-size:13px; color:var(--dim); margin-top:8px; font-family:'IBM Plex Mono',monospace; }
.cv-b { color:var(--blue); } .cv-g { color:var(--green); } .cv-y { color:var(--yellow); }

/* TABLE */
.twrap { background:var(--sur); border:1px solid var(--bdr); border-radius:8px; overflow:hidden; margin-bottom:14px; }
.thead-row { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--bdr); }
.ttitle { font-size:13px; font-weight:600; }
.side-hdr-b { background:var(--bdim); border-bottom-color:var(--blue) !important; }
.side-hdr-g { background:var(--gdim); border-bottom-color:var(--green) !important; }
.side-total { font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }

table { width:100%; border-collapse:collapse; }
th { font-size:11px; font-weight:500; color:var(--dim); text-align:left; padding:9px 14px; border-bottom:1px solid var(--bdr); background:var(--bg); letter-spacing:.04em; white-space:nowrap; }
th.r, td.r { text-align:right; }
td { padding:10px 14px; border-bottom:1px solid rgba(37,42,61,.6); font-size:13px; vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(255,255,255,.02); }
.mono { font-family:'IBM Plex Mono',monospace; }
.ab { color:var(--blue); font-family:'IBM Plex Mono',monospace; font-weight:700; }
.ag { color:var(--green); font-family:'IBM Plex Mono',monospace; font-weight:700; }
.empty { text-align:center; padding:36px; color:var(--dim); font-size:13px; }

/* CHIPS */
.chips { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px; }
.chip { padding:5px 14px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--bdr); background:var(--sur); color:var(--dim); transition:all .15s; }
.chip:hover { border-color:var(--dim); color:var(--txt); }
.chip.on { border-color:var(--blue); background:var(--bdim); color:var(--blue); }

/* COL2 */
.col2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

/* TAG */
.tag { display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px; font-weight:700; }
.tag-b { background:var(--bdim); color:var(--blue); }
.tag-g { background:var(--gdim); color:var(--green); }

/* BTN */
.tbtn { padding:5px 12px; font-size:11px; background:var(--sur2); color:var(--dim); border:1px solid var(--bdr); border-radius:4px; cursor:pointer; font-family:inherit; }
.tbtn:hover { border-color:var(--dim); color:var(--txt); }

/* TOAST */
.toast { position:fixed; bottom:22px; right:22px; background:var(--sur2); border:1px solid var(--bdr); border-radius:6px; padding:10px 16px; font-size:13px; z-index:999; transform:translateY(70px); opacity:0; transition:all .28s; }
.toast.show { transform:translateY(0); opacity:1; }
.toast.ok { border-color:var(--green); color:var(--green); }
.toast.err { border-color:var(--red); color:var(--red); }

@media(max-width:860px) { .cards { grid-template-columns:repeat(2,1fr); } .col2 { grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <div class="logo">인창<em>//</em>매입매출</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="badge" id="badge">파일 없음</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);" id="hd-date"></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="sw('upload')">📂 파일 업로드</div>
  <div class="tab" onclick="sw('dashboard')">📊 대시보드</div>
</div>

<div class="wrap">

  <!-- ══ UPLOAD ══ -->
  <div class="panel active" id="panel-upload">
    <div class="drop" id="dz">
      <input type="file" accept=".xlsx,.xls,.csv" onchange="loadFile(this.files[0])">
      <div class="drop-icon">📂</div>
      <div class="drop-title">매입 / 매출 엑셀 파일 업로드</div>
      <div class="drop-sub">
        클릭하거나 파일을 끌어다 놓으세요<br>
        <strong style="color:var(--txt)">.xlsx / .xls / .csv</strong> 지원 &nbsp;·&nbsp;
        파일명에 <strong style="color:var(--blue)">매입</strong> 또는 <strong style="color:var(--green)">매출</strong> 포함 시 자동 분류
      </div>
    </div>
    <div class="twrap">
      <div class="thead-row">
        <span class="ttitle">업로드 이력</span>
        <button class="tbtn" onclick="clearAll()">전체 초기화</button>
      </div>
      <table>
        <thead><tr><th>파일명</th><th>구분</th><th class="r">합계금액</th><th>업로드 시각</th></tr></thead>
        <tbody id="history-tbody"></tbody>
      </table>
      <div id="history-empty" style="text-align:center;padding:32px;color:var(--dim);font-size:13px;">아직 업로드된 파일이 없습니다</div>
    </div>
  </div>

  <!-- ══ DASHBOARD ══ -->
  <div class="panel" id="panel-dashboard">

    <!-- 요약 카드 -->
    <div class="cards">
      <div class="card">
        <div class="card-lbl">매입 합계</div>
        <div class="card-val cv-b" id="s-buy">₩0</div>
        <div class="card-sub" id="s-buy-sub">0건</div>
      </div>
      <div class="card">
        <div class="card-lbl">매출 합계</div>
        <div class="card-val cv-g" id="s-sell">₩0</div>
        <div class="card-sub" id="s-sell-sub">0건</div>
      </div>
      <div class="card">
        <div class="card-lbl">손익 (매출−매입)</div>
        <div class="card-val cv-y" id="s-profit">₩0</div>
        <div class="card-sub" id="s-profit-sub">—</div>
      </div>
    </div>

    <!-- 월 필터 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div class="chips" id="month-chips" style="margin-bottom:0;flex:1;"></div>
      <input id="f-partner" placeholder="거래처 검색" oninput="renderList()"
        style="background:var(--sur);border:1px solid var(--bdr);border-radius:4px;color:var(--dim);font-family:inherit;font-size:12px;padding:5px 9px;outline:none;width:130px;">
    </div>

    <!-- 매입 / 매출 업체별 리스트 -->
    <div class="col2">
      <div class="twrap">
        <div class="thead-row side-hdr-b">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;"></span>
            <span class="ttitle">매입</span>
            <span id="buy-cnt" style="font-size:11px;color:var(--dim);margin-left:4px;"></span>
          </div>
          <span class="side-total" style="color:var(--blue);" id="buy-total">₩0</span>
        </div>
        <table>
          <thead><tr><th>거래처</th><th class="r">합계금액</th><th>비중</th><th></th></tr></thead>
          <tbody id="buy-tbody"></tbody>
        </table>
      </div>
      <div class="twrap">
        <div class="thead-row side-hdr-g">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;"></span>
            <span class="ttitle">매출</span>
            <span id="sell-cnt" style="font-size:11px;color:var(--dim);margin-left:4px;"></span>
          </div>
          <span class="side-total" style="color:var(--green);" id="sell-total">₩0</span>
        </div>
        <table>
          <thead><tr><th>거래처</th><th class="r">합계금액</th><th>비중</th><th></th></tr></thead>
          <tbody id="sell-tbody"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /dashboard -->

</div><!-- /wrap -->
<div class="toast" id="toast"></div>

<script>
// ══ STATE ══════════════════════════════════════
let records = JSON.parse(localStorage.getItem('ic_v3') || '[]');
let history = JSON.parse(localStorage.getItem('ic_hist') || '[]');
let selMonth = '';

// ══ INIT ═══════════════════════════════════════
document.getElementById('hd-date').textContent =
  new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});

const dz = document.getElementById('dz');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

// ══ FORMAT ═════════════════════════════════════
function fmt(n)  { return '₩' + Math.round(n).toLocaleString('ko-KR'); }
function fmtN(n) { return Math.round(n).toLocaleString('ko-KR'); }

// ══ TABS ═══════════════════════════════════════
function sw(name) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['upload','dashboard'][i] === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  if (name === 'dashboard') renderDashboard();
}

// ══ FILE LOAD ══════════════════════════════════
function loadFile(file) {
  const isBuy  = /매입/.test(file.name);
  const isSell = /매출/.test(file.name);
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb  = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {raw:false});
      if (!raw.length) { toast('데이터가 없습니다.', 'err'); return; }
      const parsed = parseRows(raw, isBuy, isSell, file.name);
      if (!parsed.length) { toast('인식할 수 없는 파일입니다.', 'err'); return; }
      // 중복 제거 후 누적
      const key = r => r.type+'|'+r.date+'|'+r.partner+'|'+r.item+'|'+r.amount;
      const existing = new Set(records.map(key));
      const added = parsed.filter(r => !existing.has(key(r)));
      records = [...records, ...added];
      localStorage.setItem('ic_v3', JSON.stringify(records));
      // 이력
      const now = new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
      history.unshift({name:file.name, type:isBuy?'매입':'매출', total:added.reduce((a,r)=>a+r.amount,0), time:now});
      localStorage.setItem('ic_hist', JSON.stringify(history));
      renderHistory();
      setBadge(file.name);
      toast(added.length + '건 추가 (총 ' + records.length + '건)', 'ok');
    } catch(err) {
      toast('오류: ' + err.message, 'err');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

// ══ PARSE ══════════════════════════════════════
function parseRows(raw, isBuy, isSell, fileName) {
  const mapKey = k => {
    k = String(k).trim().replace(/\s+/g, '');
    if (/구분/.test(k)) return 'typeRaw';
    if (/날짜|입고일|출고일|일자/.test(k)) return 'date';
    if (/거래처|업체|고객|공급사/.test(k)) return 'partner';
    if (/현장명|현장/.test(k)) return 'site';
    if (/제품명|품목|품명/.test(k)) return 'item';
    if (/규격|사이즈/.test(k)) return 'spec';
    if (/단위/.test(k)) return 'unit';
    if (/수량/.test(k)) return 'qty';
    if (/M2|m2|㎡/.test(k)) return 'm2';
    if (/단가/.test(k)) return 'price';
    if (/금액|합계|총액/.test(k)) return 'amount';
    if (/로트|lot|비고|메모/i.test(k)) return 'note';
    return null;
  };

  const keys = Object.keys(raw[0]);
  const fieldOf = {};
  keys.forEach(h => { const f = mapKey(h); if(f) fieldOf[h] = f; });

  // 거래처 ffill (병합셀 처리)
  let lastPartner = '';
  return raw.map((row, idx) => {
    const r = {};
    for (const [h,f] of Object.entries(fieldOf)) r[f] = row[h];

    // ffill
    const p = (r.partner == null || r.partner === undefined) ? '' : String(r.partner).trim();
    if (p && p !== 'nan' && p !== 'undefined') lastPartner = p;
    else r.partner = lastPartner;

    // 날짜
    let date = '';
    if (r.date) {
      const s = String(r.date).replace(/\./g,'-').replace(/\//g,'-').trim();
      if (/^\d{8}$/.test(s)) date = s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
      else if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) date = s.slice(0,10);
      else date = s;
    }
    if (!date && fileName) {
      const m = fileName.match(/(\d{4})(\d{2})\d{2}/);
      if (m) date = m[1]+'-'+m[2]+'-01';
    }

    // 구분
    let type = '';
    if (r.typeRaw) {
      if (/매입|입고/.test(r.typeRaw)) type = '매입';
      else if (/매출|출고/.test(r.typeRaw)) type = '매출';
    }
    if (!type) type = isBuy ? '매입' : isSell ? '매출' : '매입';

    const num = v => parseFloat(String(v ?? '').replace(/,/g,'')) || 0;
    const amount = num(r.amount);
    if (!date || amount === 0) return null;

    return {
      id: Date.now() + idx,
      type, date,
      partner: String(r.partner || '').trim(),
      item:    String(r.item    || '').trim(),
      spec:    String(r.spec    || '').trim(),
      unit:    String(r.unit    || '').trim(),
      qty:   num(r.qty),
      m2:    num(r.m2),
      price: num(r.price),
      amount,
      note: String(r.site || r.note || '').trim(),
    };
  }).filter(Boolean);
}

// ══ DASHBOARD ══════════════════════════════════
function renderDashboard() {
  // 카드
  const buys  = records.filter(r => r.type === '매입');
  const sells = records.filter(r => r.type === '매출');
  const bt = buys.reduce((a,r) => a+r.amount, 0);
  const st = sells.reduce((a,r) => a+r.amount, 0);
  const profit = st - bt;
  document.getElementById('s-buy').textContent      = fmt(bt);
  document.getElementById('s-buy-sub').textContent  = buys.length + '건';
  document.getElementById('s-sell').textContent     = fmt(st);
  document.getElementById('s-sell-sub').textContent = sells.length + '건';
  const pe = document.getElementById('s-profit');
  pe.textContent = (profit >= 0 ? '+' : '') + fmt(profit);
  pe.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';

  // 월 칩
  buildChips();

  // 리스트
  renderList();
}

// ══ CHIPS ══════════════════════════════════════
function buildChips() {
  const months = [...new Set(records.map(r => r.date.slice(0,7)))].filter(Boolean).sort().reverse();
  const el = document.getElementById('month-chips');
  el.innerHTML =
    '<div class="chip ' + (selMonth===''?'on':'') + '" onclick="setMonth(\'\')">전체</div>' +
    months.map(m =>
      '<div class="chip ' + (selMonth===m?'on':'') + '" onclick="setMonth(\'' + m + '\')">' +
      m.slice(0,4) + '년 ' + parseInt(m.slice(5)) + '월</div>'
    ).join('');
}
function setMonth(m) { selMonth = m; buildChips(); renderList(); }

// ══ LIST ═══════════════════════════════════════
function renderList() {
  const pFilter = (document.getElementById('f-partner') || {value:''}).value.toLowerCase();
  const filtered = records.filter(r => {
    if (selMonth && !r.date.startsWith(selMonth)) return false;
    if (pFilter && !r.partner.toLowerCase().includes(pFilter)) return false;
    return true;
  });
  renderSide('매입', filtered, 'buy-tbody',  'buy-cnt',  'buy-total',  'var(--blue)',  'ab');
  renderSide('매출', filtered, 'sell-tbody', 'sell-cnt', 'sell-total', 'var(--green)', 'ag');
}

function renderSide(type, all, tbodyId, cntId, totalId, color, cls) {
  const rows = all.filter(r => r.type === type);

  // 업체별 집계
  const map = {};
  rows.forEach(r => {
    if (!map[r.partner]) map[r.partner] = {total:0, items:[]};
    map[r.partner].total += r.amount;
    map[r.partner].items.push(r);
  });
  const list  = Object.entries(map).sort((a,b) => b[1].total - a[1].total);
  const grand = list.reduce((a,[,v]) => a + v.total, 0);
  const maxT  = list.length ? list[0][1].total : 1;

  document.getElementById(cntId).textContent  = list.length + '개 업체';
  document.getElementById(totalId).textContent = fmt(grand);

  const tbody = document.getElementById(tbodyId);
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">데이터 없음</td></tr>';
    return;
  }

  let html = '';
  list.forEach(function([partner, g], idx) {
    const pct  = grand > 0 ? (g.total / grand * 100).toFixed(1) : '0.0';
    const barW = Math.round(g.total / maxT * 100);
    const pid  = tbodyId + idx;

    // 메인 행
    html += '<tr style="cursor:pointer;" onclick="tog(\'' + pid + '\')">';
    html += '<td style="font-size:13px;font-weight:500;">' + partner + '</td>';
    html += '<td class="r ' + cls + '" style="font-size:14px;">' + fmtN(g.total) + '</td>';
    html += '<td style="min-width:100px;padding-right:12px;">';
    html +=   '<div style="display:flex;align-items:center;gap:6px;">';
    html +=     '<div style="flex:1;background:var(--bg);border-radius:2px;height:6px;overflow:hidden;">';
    html +=       '<div style="width:' + barW + '%;height:100%;background:' + color + ';border-radius:2px;opacity:.8;"></div>';
    html +=     '</div>';
    html +=     '<span style="font-size:11px;color:var(--dim);">' + pct + '%</span>';
    html +=   '</div>';
    html += '</td>';
    html += '<td id="arr' + pid + '" style="color:var(--dim);font-size:12px;width:18px;">▶</td>';
    html += '</tr>';

    // 상세 행
    html += '<tr id="' + pid + '" style="display:none;background:var(--bg);">';
    html += '<td colspan="4" style="padding:0;">';
    html += '<table style="width:100%;border-collapse:collapse;">';
    html += '<thead><tr style="background:var(--sur2);">';
    html += '<th style="padding:7px 12px;font-size:10px;color:var(--dim);text-align:left;">날짜</th>';
    html += '<th style="padding:7px 12px;font-size:10px;color:var(--dim);text-align:left;">제품명</th>';
    html += '<th style="padding:7px 12px;font-size:10px;color:var(--dim);text-align:left;">규격</th>';
    html += '<th style="padding:7px 12px;font-size:10px;color:var(--dim);text-align:right;">금액</th>';
    html += '</tr></thead><tbody>';
    g.items.sort((a,b) => b.amount - a.amount).forEach(function(r) {
      html += '<tr style="border-top:1px solid var(--bdr);">';
      html += '<td style="padding:7px 12px;font-family:IBM Plex Mono,monospace;font-size:11px;color:var(--dim);">' + r.date + '</td>';
      html += '<td style="padding:7px 12px;font-size:12px;">' + r.item + (r.note ? ' <span style="color:var(--dim);font-size:10px;">(' + r.note + ')</span>' : '') + '</td>';
      html += '<td style="padding:7px 12px;font-size:11px;color:var(--dim);">' + r.spec + '</td>';
      html += '<td style="padding:7px 12px;font-family:IBM Plex Mono,monospace;font-size:12px;font-weight:700;text-align:right;color:' + color + ';">' + fmtN(r.amount) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></td></tr>';
  });
  tbody.innerHTML = html;
}

function tog(id) {
  const el  = document.getElementById(id);
  const arr = document.getElementById('arr' + id);
  const show = el.style.display === 'none';
  el.style.display = show ? 'table-row' : 'none';
  if (arr) arr.textContent = show ? '▼' : '▶';
}

// ══ HISTORY ════════════════════════════════════
function renderHistory() {
  const tbody = document.getElementById('history-tbody');
  const empty = document.getElementById('history-empty');
  if (!history.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  tbody.innerHTML = history.map(function(h) {
    const isBuy = h.type === '매입';
    return '<tr>' +
      '<td style="font-size:12px;">' + h.name + '</td>' +
      '<td><span class="tag ' + (isBuy?'tag-b':'tag-g') + '">' + h.type + '</span></td>' +
      '<td class="r ' + (isBuy?'ab':'ag') + '">' + fmtN(h.total) + '</td>' +
      '<td style="color:var(--dim);font-size:11px;font-family:IBM Plex Mono,monospace;">' + h.time + '</td>' +
    '</tr>';
  }).join('');
}

function setBadge(name) {
  const b = document.getElementById('badge');
  b.textContent = '✓ ' + name;
  b.classList.add('on');
}

function clearAll() {
  if (!confirm('모든 데이터를 초기화하시겠습니까?')) return;
  records = []; history = [];
  localStorage.removeItem('ic_v3');
  localStorage.removeItem('ic_hist');
  selMonth = '';
  document.getElementById('badge').textContent = '파일 없음';
  document.getElementById('badge').classList.remove('on');
  renderHistory();
  toast('초기화 완료', 'ok');
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type||'ok') + ' show';
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove('show'); }, 2800);
}

// ══ BOOT ═══════════════════════════════════════
renderHistory();
if (records.length) {
  setBadge('저장된 데이터 ' + records.length + '건');
}
</script>
</body>
</html>
