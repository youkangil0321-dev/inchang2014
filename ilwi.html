<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>표준 일위대가</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#0f1c2e;}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}

/* ── LIST 화면 ── */
#listView{display:flex;flex-direction:column;flex:1;padding:14px 12px 12px;min-height:100vh;min-height:100dvh;}
.list-header{display:flex;flex-direction:column;align-items:center;margin-bottom:12px;}
.list-header h1{font-size:22px;font-weight:900;letter-spacing:12px;color:#fff;text-indent:12px;}
.list-header-deco{display:flex;align-items:center;width:100%;gap:8px;margin-top:5px;}
.list-header-deco .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#4a90d9);}
.list-header-deco .ln.r{background:linear-gradient(90deg,#4a90d9,transparent);}
.list-header-deco .dot{width:6px;height:6px;border-radius:50%;background:#4a90d9;box-shadow:0 0 8px #4a90d9;}
.search-bar{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(74,144,217,0.3);
  border-radius:10px;padding:8px 14px;margin-bottom:10px;
}
.search-bar input{
  flex:1;background:transparent;border:none;outline:none;
  color:#fff;font-size:14px;font-family:inherit;
}
.search-bar input::placeholder{color:rgba(255,255,255,0.35);}
.search-bar .icon{color:#4a90d9;font-size:16px;}
.list-wrap{flex:1;overflow-y:auto;border-radius:12px;border:1px solid rgba(74,144,217,0.2);}
.list-table{width:100%;border-collapse:collapse;}
.list-table thead th{
  background:linear-gradient(180deg,#1a3456,#0f1c2e);
  color:#c8daf0;font-size:12px;font-weight:700;
  padding:9px 8px;text-align:center;position:sticky;top:0;z-index:1;
  border-right:1px solid rgba(74,144,217,0.2);white-space:nowrap;
}
.list-table thead th:last-child{border-right:none;}
.list-table tbody tr{cursor:pointer;transition:background 0.12s;}
.list-table tbody tr:nth-child(odd) td{background:#1a2a40;}
.list-table tbody tr:nth-child(even) td{background:#162238;}
.list-table tbody tr:hover td{background:#1e3a5f;}
.list-table tbody td{
  padding:10px 8px;
  border-bottom:1px solid rgba(74,144,217,0.1);
  border-right:1px solid rgba(74,144,217,0.1);
  color:#e0eaf8;font-size:13px;font-weight:600;
}
.list-table tbody td:last-child{border-right:none;}
.no-cell{color:#4a90d9;font-weight:800;text-align:center;width:36px;}
.system-cell{font-size:13px;}
.total-badge{
  display:inline-block;
  background:rgba(74,144,217,0.15);
  border:1px solid rgba(74,144,217,0.3);
  border-radius:6px;padding:2px 7px;
  color:#7dc0f8;font-size:12px;font-weight:700;
  white-space:nowrap;
}
.na-badge{
  color:#666;font-size:12px;
}
.note-badge{
  font-size:11px;color:#8aaccc;
}
.arrow{color:#4a90d9;font-size:14px;text-align:center;width:20px;}

/* ── 상세 화면 ── */
#detailView{display:none;flex-direction:column;flex:1;padding:14px 12px 12px;min-height:100vh;min-height:100dvh;}
#detailContent{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.detail-topbar{
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.back-btn{
  background:rgba(74,144,217,0.15);border:1px solid rgba(74,144,217,0.35);
  border-radius:8px;padding:7px 12px;color:#7dc0f8;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
.detail-title{
  color:#fff;font-size:15px;font-weight:800;letter-spacing:1px;
  flex:1;text-align:center;
}
.meta-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#0f1c2e,#1a3456);
  border-radius:10px;padding:9px 14px;margin-bottom:10px;
  border:1px solid rgba(74,144,217,0.2);
  box-shadow:0 4px 16px rgba(15,28,46,0.4);
}
.meta-title{color:#e8f0fb;font-size:14px;font-weight:700;letter-spacing:1px;}
.meta-title span{color:#4a90d9;font-weight:900;}
.meta-right{display:flex;align-items:center;gap:8px;}
.meta-label{color:#7aa8d8;font-size:13px;font-weight:600;}
.area-input{
  background:rgba(74,144,217,0.12);border:1.5px solid rgba(74,144,217,0.4);
  border-radius:7px;color:#fff;font-size:15px;font-weight:700;
  width:76px;text-align:center;padding:5px 5px;font-family:inherit;outline:none;
}
.area-input::placeholder{color:rgba(255,255,255,0.3);}
.area-input:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,0.2);}
.detail-card{
  background:#f8fafd;border-radius:12px;
  border:1px solid #d0dced;
  box-shadow:0 2px 16px rgba(15,28,46,0.08);
  overflow:hidden;margin-bottom:10px;
}
.section-header{
  background:linear-gradient(90deg,#1a3456,#0f1c2e);
  color:#c8daf0;font-size:13px;font-weight:700;
  padding:7px 12px;letter-spacing:1px;
  border-bottom:1px solid rgba(74,144,217,0.2);
}
table.dtable{width:100%;border-collapse:collapse;table-layout:auto;}
table.dtable thead th{
  background:linear-gradient(180deg,#1a3456,#0f1c2e);
  color:#c8daf0;font-size:12px;font-weight:700;
  padding:8px 5px;text-align:center;
  border-right:1px solid rgba(74,144,217,0.2);white-space:nowrap;
}
table.dtable thead th:last-child{border-right:none;}
table.dtable thead th.qty-head{color:#4a90d9;font-size:13px;}
table.dtable tbody tr:nth-child(odd) td{background:#ffffff;}
table.dtable tbody tr:nth-child(even) td{background:#f2f6fc;}
table.dtable tbody tr:hover td{background:#e6eef9;}
table.dtable tbody td{
  padding:8px 5px;
  border-bottom:1px solid #dde5f0;
  border-right:1px solid #dde5f0;
  font-size:12px;font-weight:600;color:#1a2a4a;
}
table.dtable tbody td:last-child{border-right:none;}
table.dtable tbody tr:last-child td{border-bottom:none;}
.qty-cell{
  font-weight:800;color:#1a4a8a;font-size:13px;
  text-align:center;
  background:linear-gradient(135deg,#e8f1fc,#d4e6f9)!important;
  border-left:2px solid #4a90d9!important;
  white-space:nowrap;
}
.btn-row{display:flex;gap:8px;margin-top:4px;}
.btn-share{flex:1;padding:11px 6px;font-size:14px;font-family:inherit;font-weight:700;
  cursor:pointer;border-radius:10px;border:none;
  background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff;
  box-shadow:0 4px 12px rgba(243,156,18,0.35);}
.btn-dl{flex:1;padding:11px 6px;font-size:14px;font-family:inherit;font-weight:700;
  cursor:pointer;border-radius:10px;border:none;
  background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;
  box-shadow:0 4px 12px rgba(39,174,96,0.35);}
button:active{transform:scale(0.96);opacity:0.9;}

@media(max-width:600px){
  #listView,#detailView{padding:10px 10px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));}
  .list-header h1{font-size:19px;letter-spacing:8px;}
  .detail-title{font-size:14px;}
}
</style>
</head>
<body>

<!-- ── LIST 화면 ── -->
<div id="listView">
  <div class="list-header">
    <h1>일 위 대 가</h1>
    <div class="list-header-deco">
      <div class="ln"></div><div class="dot"></div><div class="ln r"></div>
    </div>
  </div>
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="품목 검색..." oninput="filterList()">
  </div>
  <div class="list-wrap">
    <table class="list-table">
      <thead>
        <tr>
          <th>No.</th>
          <th style="text-align:left">SYSTEM</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
</div>

<!-- ── 상세 화면 ── -->
<div id="detailView">
  <div class="detail-topbar">
    <button class="back-btn" onclick="showList()">← 목록</button>
    <div class="detail-title" id="detailTitle"></div>
  </div>
  <div class="meta-bar">
    <span class="meta-title" id="metaTitle"></span>
    <div class="meta-right">
      <span class="meta-label">면적(㎡)</span>
      <input class="area-input" id="areaInput" type="number" placeholder="입력" oninput="recalc()">
    </div>
  </div>
  <div id="detailContent"></div>
  <div class="btn-row">
    <button class="btn-share" onclick="shareDetail()">📤 공유</button>
    <button class="btn-dl"    onclick="exportCSV()">⬇︎ 다운로드</button>
  </div>
</div>

// ── 수량 계산 규칙 (단위길이로 나누기 올림) ──
const CALC_RULES = [
  { match: n => n.includes('Bolt (전산도금)'),                              div: 3     },
  { match: n => n.includes('Carrying Channel'),                            div: 4     },
  { match: n => n.includes('Minor Channel KS'),                            div: 4     },
  { match: n => n.includes('M-Bar KS'),                                    div: 4     },
  { match: n => /main/i.test(n) && /t.?bar/i.test(n),                     div: 3.658 },
  { match: n => /cross/i.test(n) && /t.?bar/i.test(n) && !/joiner/i.test(n), div: 0.61  },
];
function calcQty(name, qty, area) {
  const raw = qty * area;
  for (const rule of CALC_RULES) {
    if (rule.match(name)) return Math.ceil(raw / rule.div);
  }
  return Math.round(raw);
}

// ── 비고 강제 적용 규칙 ──
const NOTE_OVERRIDE = {
  'Bolt (전산도금)':   '3M',
  'Carrying Channel KS': '4M',
  'Minor Channel KS':    '4M',
  'M-Bar KS':            '4M',
};
function getNote(name, original) {
  for (const key of Object.keys(NOTE_OVERRIDE)) {
    if (name.includes(key)) return NOTE_OVERRIDE[key];
  }
  return original;
}

// ── 리스트 렌더링 ──
function renderList(arr) {
  const tbody = document.getElementById('listBody');
  tbody.innerHTML = '';
  arr.forEach(item => {
    const tr = document.createElement('tr');
    tr.onclick = () => showDetail(item.no);
    const totalStr = item.total != null
      ? `<span class="total-badge">${item.total.toLocaleString()}</span>`
      : `<span class="na-badge">-</span>`;
    const noteStr = item.note ? `<span class="note-badge">${item.note}</span>` : '';
    tr.innerHTML = `
      <td class="no-cell">${item.no}</td>
      <td class="system-cell">${item.system}</td>
      <td class="arrow">›</td>`;
    tbody.appendChild(tr);
  });
}

function filterList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = q
    ? DATA.list.filter(i => i.system.toLowerCase().includes(q) || String(i.no).includes(q))
    : DATA.list;
  renderList(filtered);
}

// ── 상세 화면 ──
let currentNo = null;

function showDetail(no) {
  currentNo = no;
  const sheet = DATA.sheets[String(no)];
  if (!sheet) return;

  document.getElementById('listView').style.display = 'none';
  const dv = document.getElementById('detailView');
  dv.style.display = 'flex';

  document.getElementById('detailTitle').textContent = `No.${no}`;
  document.getElementById('metaTitle').innerHTML = `[ <span>${sheet.title.replace(/[\[\]]/g,'').trim()}</span> ]`;
  document.getElementById('areaInput').value = '';

  // 섹션별 테이블 렌더
  const content = document.getElementById('detailContent');
  content.innerHTML = '';
  sheet.sections.forEach(sec => {
    if (!sec.rows.length) return;
    if (sec.name === '시공비') return;
    const card = document.createElement('div');
    card.className = 'detail-card';
    card.innerHTML = `<div class="section-header">${sec.name}</div>
      <table class="dtable">
        <thead><tr>
          <th style="width:30%">품명</th>
          <th style="width:26%">규격</th>
          <th style="width:9%">단위</th>
          <th style="width:14%">비고</th>
          <th class="qty-head" style="width:21%">수 량</th>
        </tr></thead>
        <tbody>${sec.rows.map((r,i)=>
          `<tr>
            <td style="padding-left:8px">${r.name}</td>
            <td style="padding-left:6px">${r.spec}</td>
            <td style="text-align:center">${r.unit}</td>
            <td style="text-align:center;font-size:11px">${getNote(r.name, r.note)}</td>
            <td class="qty-cell" id="q_${sec.name}_${i}">-</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
    content.appendChild(card);
  });

  recalc();
}

function getArea() { return parseFloat(document.getElementById('areaInput').value) || 0; }

function recalc() {
  if (!currentNo) return;
  const area = getArea();
  const sheet = DATA.sheets[String(currentNo)];
  sheet.sections.forEach(sec => {
    sec.rows.forEach((r, i) => {
      const el = document.getElementById(`q_${sec.name}_${i}`);
      if (!el) return;
      if (!area || r.qty == null) { el.textContent = '-'; return; }
      el.textContent = calcQty(r.name, r.qty, area).toLocaleString();
    });
  });
}

function showList() {
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('listView').style.display = 'flex';
}

// ── 공유 ──
async function shareDetail() {
  const area = getArea();
  if (!area) { alert('면적을 먼저 입력해주세요.'); return; }
  const sheet = DATA.sheets[String(currentNo)];

  const original = document.getElementById('detailView');
  const btnRow   = original.querySelector('.btn-row');
  const clone    = original.cloneNode(true);
  clone.querySelector('.btn-row')?.remove();
  clone.querySelector('.back-btn')?.remove();
  Object.assign(clone.style, {
    position:'fixed', top:'-9999px', left:'0',
    width: original.offsetWidth+'px', height:'auto', minHeight:'unset',
    display:'block', borderRadius:'0', boxShadow:'none', background:'#0f1c2e',
    padding:'14px 12px'
  });
  clone.querySelectorAll('.qty-cell').forEach(el => {
    Object.assign(el.style, {lineHeight:'1.4', display:'flex', alignItems:'center', justifyContent:'center'});
  });
  clone.querySelectorAll('input').forEach(inp => {
    const div = document.createElement('div');
    div.textContent = inp.value;
    Object.assign(div.style, {
      fontSize: getComputedStyle(inp).fontSize,
      fontWeight: getComputedStyle(inp).fontWeight,
      color: '#fff', padding: '5px 6px',
      textAlign: 'center', lineHeight:'1.4',
      display:'flex', alignItems:'center', justifyContent:'center',
      width:'100%', boxSizing:'border-box'
    });
    inp.replaceWith(div);
  });
  document.body.appendChild(clone);

  try {
    const canvas = await html2canvas(clone, {
      scale:2, useCORS:true, backgroundColor:'#0f1c2e', logging:false,
      width: clone.offsetWidth, height: clone.scrollHeight,
      windowWidth: clone.offsetWidth, windowHeight: clone.scrollHeight
    });
    canvas.toBlob(async (blob) => {
      const file = new File([blob], '일위대가.png', {type:'image/png'});
      if (navigator.canShare?.({files:[file]})) {
        await navigator.share({files:[file], title:'일위대가'}).catch(()=>{});
      } else if (navigator.share) {
        await navigator.share({title:sheet.title, text: sheet.title + '\n면적: '+area+'㎡'}).catch(()=>{});
      } else {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = '일위대가.png'; a.click();
      }
    }, 'image/png');
  } finally {
    document.body.removeChild(clone);
  }
}

// ── CSV ──
function exportCSV() {
  const area = getArea();
  const sheet = DATA.sheets[String(currentNo)];
  let csv = '구분,품명,규격,단위,단위수량,수량\n';
  sheet.sections.forEach(sec => {
    sec.rows.forEach(r => {
      const qty = (area && r.qty != null) ? calcQty(r.name, r.qty, area) : '';
      csv += `"${sec.name}","${r.name}","${r.spec}","${r.unit}","${getNote(r.name,r.note)}",${r.qty??''},${qty}\n`;
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'}));
  a.download = `일위대가_${sheet.title.replace(/[\[\] ]/g,'')}.csv`;
  a.click();
}

// 초기 렌더
renderList(DATA.list);
</script>
